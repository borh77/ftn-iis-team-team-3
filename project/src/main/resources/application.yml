spring:
  application:
    name: nais-user-project
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nais_users}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}
  jwt:
    secret: ${APP_JWT_SECRET:7d4f8f9a1c2345b6789cdef0123456789cdef0123456789cdef0123456789abc}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:480}
  security:
    bootstrap-admin:
      username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin123!}

server:
  port: 8080