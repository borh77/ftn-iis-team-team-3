spring:
  application:
    name: iis-drug-crm
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/iis_drug_crm}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/iis_drug_crm_analytics}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:480}
  security:
    bootstrap-admin:
      username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
      email: ${BOOTSTRAP_ADMIN_EMAIL:admin@local.dev}
      password: ${BOOTSTRAP_ADMIN_PASSWORD}

server:
  port: 8080