<div class="page-wrapper">

  <!-- Navigation bar -->
  <nav class="ae-nav">
    <a class="nav-link" routerLink="/adverse-effects/my-reports" routerLinkActive="active">My Reports</a>
    <a class="nav-link active-page" routerLink="/adverse-effects/create-doctor-report" routerLinkActive="active">+ New Report</a>
  </nav>

  <div class="form-card">
    <div class="form-header">
      <h1>New Adverse Effect Report</h1>
      <p>Fill in all required information about the adverse drug effect.</p>
    </div>

    <form (ngSubmit)="submit()" #reportForm="ngForm">

      <div class="form-group">
        <label for="medicationName">Medication name *</label>
        <input
          id="medicationName"
          type="text"
          [(ngModel)]="form.medicationName"
          name="medicationName"
          placeholder="e.g. Aspirin 500mg"
          required
        />
      </div>

      <div class="form-group">
        <label for="severity">Severity *</label>
        <select id="severity" [(ngModel)]="form.severity" name="severity" required>
          <option value="">-- Select --</option>
          <option *ngFor="let s of severityOptions" [value]="s">{{ s }}</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="patientGender">Patient gender</label>
          <select id="patientGender" [(ngModel)]="form.patientGender" name="patientGender">
            <option value="">-- Select --</option>
            <option *ngFor="let g of genderOptions" [value]="g">{{ g }}</option>
          </select>
        </div>
        <div class="form-group">
          <label for="patientAge">Patient age</label>
          <input id="patientAge" type="number" [(ngModel)]="form.patientAge" name="patientAge" min="0" max="120" placeholder="e.g. 45" />
        </div>
      </div>

      <div class="form-group">
        <label for="symptomDate">Symptom date *</label>
        <input
          id="symptomDate"
          type="date"
          [(ngModel)]="form.symptomDate"
          name="symptomDate"
          [max]="today"
          required
        />
      </div>

      <div class="form-group">
        <label for="effectDescription">Effect description *</label>
        <textarea
          id="effectDescription"
          [(ngModel)]="form.effectDescription"
          name="effectDescription"
          rows="4"
          placeholder="Describe the adverse effect the patient experienced..."
          required
        ></textarea>
      </div>

      <div class="form-group">
        <label for="additionalNotes">Additional notes</label>
        <textarea
          id="additionalNotes"
          [(ngModel)]="form.additionalNotes"
          name="additionalNotes"
          rows="3"
          placeholder="Optional — enter any additional information..."
        ></textarea>
      </div>

      <div class="success-message" *ngIf="successMessage">{{ successMessage }}</div>
      <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="goToMyReports()">
          ← My Reports
        </button>
        <button type="submit" class="btn-primary" [disabled]="saving || reportForm.invalid">
          {{ saving ? 'Saving...' : 'Create Report' }}
        </button>
      </div>

    </form>
  </div>
</div>
