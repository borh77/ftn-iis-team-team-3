<div class="page-wrapper">

  <nav class="ae-nav">
    <a class="nav-link" routerLink="/adverse-effects/my-reports" routerLinkActive="active">← My Reports</a>
  </nav>

  <div class="loading" *ngIf="loading">Loading...</div>
  <div class="error-message" *ngIf="errorMessage && loading">{{ errorMessage }}</div>

  <div class="form-card" *ngIf="!loading">
    <div class="form-header">
      <h1>Edit Report #{{ reportId }}</h1>
      <p>You can edit this report while its status is <strong>SUBMITTED</strong>.</p>
    </div>

    <form (ngSubmit)="submit()" #editForm="ngForm">

      <div class="form-group">
        <label for="medicationName">Medication name *</label>
        <input id="medicationName" type="text" [(ngModel)]="form.medicationName" name="medicationName" required />
      </div>

      <div class="form-group">
        <label for="severity">Severity *</label>
        <select id="severity" [(ngModel)]="form.severity" name="severity" required>
          <option value="">-- Select --</option>
          <option *ngFor="let s of severityOptions" [value]="s">{{ s }}</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="patientGender">Patient gender</label>
          <select id="patientGender" [(ngModel)]="form.patientGender" name="patientGender">
            <option value="">-- Select --</option>
            <option *ngFor="let g of genderOptions" [value]="g">{{ g }}</option>
          </select>
        </div>
        <div class="form-group">
          <label for="patientAge">Patient age</label>
          <input id="patientAge" type="number" [(ngModel)]="form.patientAge" name="patientAge" min="0" max="120" placeholder="e.g. 45" />
        </div>
      </div>

      <div class="form-group">
        <label for="symptomDate">Symptom date *</label>
        <input id="symptomDate" type="date" [(ngModel)]="form.symptomDate" name="symptomDate" [max]="today" required />
      </div>

      <div class="form-group">
        <label for="effectDescription">Effect description *</label>
        <textarea id="effectDescription" [(ngModel)]="form.effectDescription" name="effectDescription" rows="4" required></textarea>
      </div>

      <div class="form-group">
        <label for="additionalNotes">Additional notes</label>
        <textarea id="additionalNotes" [(ngModel)]="form.additionalNotes" name="additionalNotes" rows="3"
          placeholder="Optional..."></textarea>
      </div>

      <div class="error-message" *ngIf="errorMessage && !loading">{{ errorMessage }}</div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="goBack()">← Cancel</button>
        <button type="submit" class="btn-primary" [disabled]="saving || editForm.invalid">
          {{ saving ? 'Saving...' : 'Save Changes' }}
        </button>
      </div>

    </form>
  </div>
</div>
