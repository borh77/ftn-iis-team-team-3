<div class="page-wrapper">
  <div class="form-card">
    <div class="form-header">
      <h1>Report an Adverse Drug Effect</h1>
      <p>Select your medication and describe what you experienced. Your report will be reviewed by our pharmacovigilance team.</p>
    </div>

    <form (ngSubmit)="submit()" #reportForm="ngForm">

      <!-- Step 1: Medication -->
      <div class="form-group">
        <label for="medicationName">Medication *</label>
        <select id="medicationName" [(ngModel)]="form.medicationName" name="medicationName" (change)="onMedicationChange()" required>
          <option value="">-- Select medication --</option>
          <option *ngFor="let m of medications" [value]="m">{{ m }}</option>
        </select>
      </div>

      <!-- Step 2: Symptoms (shown after medication selected) -->
      <div class="form-group" *ngIf="form.medicationName">
        <label>Symptoms * <span class="hint">Select all that apply</span></label>
        <div class="symptom-chips">
          <button
            type="button"
            class="chip"
            *ngFor="let s of availableSymptoms"
            [class.selected]="isSelected(s)"
            (click)="toggleSymptom(s)">
            {{ s }}
          </button>
        </div>
        <div class="selected-info" *ngIf="selectedSymptoms.length > 0">
          Selected: <strong>{{ selectedSymptoms.join(', ') }}</strong>
        </div>
        <div class="selected-info warn" *ngIf="selectedSymptoms.length === 0">
          Please select at least one symptom.
        </div>
      </div>

      <!-- Other fields -->
      <div class="form-row" *ngIf="form.medicationName">
        <div class="form-group">
          <label for="patientGender">Gender</label>
          <select id="patientGender" [(ngModel)]="form.patientGender" name="patientGender">
            <option value="">-- Select --</option>
            <option *ngFor="let g of genderOptions" [value]="g">{{ g }}</option>
          </select>
        </div>
        <div class="form-group">
          <label for="patientAge">Age</label>
          <input id="patientAge" type="number" [(ngModel)]="form.patientAge" name="patientAge" min="0" max="120" placeholder="e.g. 45" />
        </div>
      </div>

      <div class="form-group" *ngIf="form.medicationName">
        <label for="symptomDate">Date symptoms appeared *</label>
        <input id="symptomDate" type="date" [(ngModel)]="form.symptomDate" name="symptomDate" [max]="today" required />
      </div>

      <div class="form-group" *ngIf="form.medicationName">
        <label for="additionalDesc">Additional information</label>
        <textarea id="additionalDesc" [(ngModel)]="form.additionalDesc" name="additionalDesc" rows="3"
          placeholder="Optional — any other relevant details..."></textarea>
      </div>

      <div class="success-message" *ngIf="successMessage">✓ {{ successMessage }}</div>
      <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>

      <div class="form-actions" *ngIf="form.medicationName">
        <button type="submit" class="btn-primary" [disabled]="saving || selectedSymptoms.length === 0 || !form.symptomDate">
          {{ saving ? 'Submitting...' : 'Submit Report' }}
        </button>
      </div>

    </form>
  </div>
</div>
