<header class="app-header">
  <div class="header-left">
    <div class="logo">IIS</div>
    <div class="brand-copy">
      <span class="brand-title">Drug CRM</span>
      <span class="brand-subtitle">Secure access portal</span>
    </div>
  </div>

  <div class="header-right">
    @if (authService.session$ | async; as session) {
      @if (session.roles.includes('ROLE_ADMIN')) {
        <nav class="admin-nav" aria-label="Admin navigation">
          <a routerLink="/admin/users">Users</a>
          <a routerLink="/admin/regions">Regions</a>
          <a routerLink="/admin/activity-logs">Activity logs</a>
          <a routerLink="/admin/reports">Reports</a>
        </nav>
      }
      <a class="profile profile-link-card" routerLink="/profile" aria-label="My Profile">
        <div class="avatar">{{ session.username.charAt(0).toUpperCase() }}</div>
        <div class="profile-meta">
          <span class="profile-name">{{ displayName || session.username }}</span>
          <span class="profile-role">{{ session.roles[0] }}</span>
        </div>
      </a>
      <button type="button" class="logout-button" (click)="onLogout()">
        Logout
      </button>
    }
  </div>
</header>
