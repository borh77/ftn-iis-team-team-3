<header class="app-header">
  <div class="header-title">
    <span class="eyebrow">Pharmaceutical CRM</span>
    <strong>Operational workspace</strong>
  </div>

  <label class="header-search">
    <lucide-icon [img]="icons.Search" size="18"></lucide-icon>
    <input type="search" placeholder="Search records, customers, pricelists..." />
  </label>

  @if (authService.session$ | async; as session) {
    <a class="profile profile-link-card" routerLink="/profile" aria-label="My Profile">
      <div class="avatar">{{ session.username.charAt(0).toUpperCase() }}</div>
      <div class="profile-meta">
        <span class="profile-name">{{ displayName || session.username }}</span>
        <span class="profile-role">{{ session.roles[0] }}</span>
      </div>
    </a>
    <button type="button" class="logout-button" (click)="onLogout()">
      <lucide-icon [img]="icons.LogOut" size="17"></lucide-icon>
      <span>Logout</span>
    </button>
  }
</header>
