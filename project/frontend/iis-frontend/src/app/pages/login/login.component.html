<section class="auth-card">
  <div class="auth-copy">
    <p class="kicker">Welcome back</p>
    <h2>Sign in to your account</h2>
    <p>
      Enter your credentials to access the IIS Drug CRM.
    </p>
  </div>

  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    <label>
      <span>Username</span>
      <input type="text" formControlName="username" autocomplete="username" (focus)="onFieldFocus()" />
      @if (form.controls.username.touched && form.controls.username.invalid) {
        <small>Username is required.</small>
      }
    </label>

    <label>
      <span>Password</span>
      <input type="password" formControlName="password" autocomplete="current-password" (focus)="onFieldFocus()" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small>Password is required.</small>
      }
    </label>

    @if (errorMessage) {
      <div class="error-box">{{ errorMessage }}</div>
    }

    <button type="submit" [disabled]="form.invalid || loading">
      {{ loading ? 'Signing in...' : 'Sign In' }}
    </button>
  </form>
</section>
