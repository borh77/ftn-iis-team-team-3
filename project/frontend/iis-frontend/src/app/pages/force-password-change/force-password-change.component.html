<section class="auth-card force-card">
  <div class="auth-copy">
    <p class="kicker">Security required</p>
    <h2>Change your initial password</h2>
    <p>
      Hello {{ username }}, choose a new password before continuing to the application.
    </p>
  </div>

  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    <label>
      <span>Current password</span>
      <input type="password" formControlName="oldPassword" autocomplete="current-password" />
      @if (form.controls.oldPassword.touched && form.controls.oldPassword.invalid) {
        <small>Current password is required.</small>
      }
    </label>

    <label>
      <span>New password</span>
      <input type="password" formControlName="newPassword" autocomplete="new-password" />
      @if (form.controls.newPassword.touched && form.controls.newPassword.invalid) {
        <small>
          Password must be at least 8 characters long and include a number and a special character.
        </small>
      }
      @if (form.touched && form.errors?.['passwordUnchanged']) {
        <small>New password must be different from the current password.</small>
      }
    </label>

    <label>
      <span>Confirm new password</span>
      <input type="password" formControlName="confirmNewPassword" autocomplete="new-password" />
      @if (form.touched && form.errors?.['passwordsMismatch']) {
        <small>Passwords do not match.</small>
      }
    </label>

    @if (errorMessage) {
      <div class="error-box">{{ errorMessage }}</div>
    }

    @if (successMessage) {
      <div class="success-box">{{ successMessage }}</div>
    }

    <button type="submit" [disabled]="form.invalid || loading">
      {{ loading ? 'Saving...' : 'Update Password' }}
    </button>
  </form>
</section>
