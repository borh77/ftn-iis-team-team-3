@if (router.url.startsWith('/login') || router.url.startsWith('/force-password-change')) {
  <div class="public-layout">
    <router-outlet></router-outlet>
  </div>
} @else {
  <div class="shell">
    <aside class="sidebar compact">
      <div class="sidebar-top">
        <button class="hamburger" onclick="document.querySelector('.shell')?.classList.toggle('sidebar-expanded')" aria-label="Toggle menu">☰</button>
        <div class="logo-compact" title="IIS">
          <span class="logo-text">IIS</span>
        </div>
      </div>

      <nav class="nav-compact">
        <a routerLink="/admin/users" routerLinkActive="active" title="Admin Users"><span class="icon">👥</span><span class="label">Admin</span></a>
        @if (authService.session$ | async; as session) {
          @if (session.roles.includes('ROLE_PRICELIST_CREATOR')) {
            <a routerLink="/teams" routerLinkActive="active" title="My Teams"><span class="icon">👥</span><span class="label">Teams</span></a>
          }
        }
        <a routerLink="/content" routerLinkActive="active" title="Pricelist Owner"><span class="icon">📄</span><span class="label">Pricelists</span></a>
        <a routerLink="/published-pricelists" routerLinkActive="active" title="Buyer View"><span class="icon">🛒</span><span class="label">Buy</span></a>
        <a routerLink="/profile" routerLinkActive="active" title="My Profile"><span class="icon">👤</span><span class="label">Profile</span></a>
      </nav>
    </aside>

    <main class="workspace">
      <app-header></app-header>
      <router-outlet></router-outlet>
    </main>
  </div>
}
