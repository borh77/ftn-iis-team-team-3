<section class="panel">
  <header>
    <p class="kicker">Create User</p>
    <h3>New account</h3>
  </header>

  <form [formGroup]="form" (ngSubmit)="submit()" class="form-grid">
    <label>
      <span>Username</span>
      <input type="text" formControlName="username" />
    </label>

    <label>
      <span>First name</span>
      <input type="text" formControlName="firstName" />
    </label>

    <label>
      <span>Last name</span>
      <input type="text" formControlName="lastName" />
    </label>

    <label>
      <span>Email</span>
      <input type="email" formControlName="email" />
    </label>

    <label>
      <span>Initial password</span>
      <input type="password" formControlName="password" />
    </label>

    <label>
      <span>Role</span>
      <select formControlName="role">
        <option value="ROLE_ADMIN">ROLE_ADMIN</option>
        <option value="ROLE_PORTFOLIO_MANAGER">ROLE_PORTFOLIO_MANAGER</option>
        <option value="ROLE_PRICELIST_CREATOR">ROLE_PRICELIST_CREATOR</option>
        <option value="ROLE_BUYER">ROLE_BUYER</option>
        <option value="ROLE_SALES_REPRESENTATIVE">ROLE_SALES_REPRESENTATIVE</option>
        <option value="ROLE_ACCOUNT_MANAGER">ROLE_ACCOUNT_MANAGER</option>
        <option value="ROLE_SALES_MANAGER">ROLE_SALES_MANAGER</option>
      </select>
    </label>

    @if (isBuyerRole) {
      <label>
        <span>Buyer region</span>
        <select formControlName="regionId">
          <option [ngValue]="null">{{ loadingRegions ? 'Loading regions...' : 'Select region' }}</option>
          @for (region of regions; track region.id) {
            <option [ngValue]="region.id">{{ region.name }} ({{ region.code }})</option>
          }
        </select>
      </label>

      <label>
        <span>Customer segment</span>
        <input type="text" formControlName="customerSegment" placeholder="Pharmacy chains" />
      </label>
    }

    @if (successMessage) {
      <div class="success-box">{{ successMessage }}</div>
    }

    @if (errorMessage) {
      <div class="error-box">{{ errorMessage }}</div>
    }

    <button type="submit" [disabled]="form.invalid || loading">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-right:8px; vertical-align:middle">
        <path d="M15 14c2.761 0 5 2.239 5 5v1H4v-1c0-2.761 2.239-5 5-5h6z" stroke="currentColor" stroke-width="1.2" fill="currentColor" />
        <path d="M12 12a4 4 0 100-8 4 4 0 000 8z" stroke="currentColor" stroke-width="1.2" fill="currentColor" />
      </svg>
      {{ loading ? 'Saving...' : 'Create User' }}
    </button>
  </form>
</section>
