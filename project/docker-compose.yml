services:
  postgres:
    image: postgres:16-alpine
    container_name: iis-drug-crm-postgres
    environment:
      POSTGRES_DB: nais_users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: iis-drug-crm-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iis-drug-crm-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nais_users
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      APP_FRONTEND_URL: http://localhost:4200
      APP_JWT_SECRET: 7d4f8f9a1c2345b6789cdef0123456789cdef0123456789cdef0123456789abc
      APP_JWT_EXPIRATION_MINUTES: 480
      BOOTSTRAP_ADMIN_USERNAME: admin
      BOOTSTRAP_ADMIN_PASSWORD: Admin123!
    depends_on:
      - postgres
      - mailhog
    ports:
      - "8080:8080"

volumes:
  postgres_data: