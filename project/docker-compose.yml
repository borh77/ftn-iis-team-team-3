services:
  postgres:
    image: postgres:16-alpine
    container_name: iis-drug-crm-postgres
    environment:
      POSTGRES_DB: iis_drug_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - iis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iis_drug_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: iis-drug-crm-mongodb
    ports:
      - "27017:27017"
    volumes:
      - iis_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping: 1}).ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo-express:
    image: mongo-express:1.0.2
    container_name: iis-drug-crm-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      mongodb:
        condition: service_healthy

  metabase:
    image: metabase/metabase:v0.50.26
    container_name: iis-drug-crm-metabase
    ports:
      - "3000:3000"
    volumes:
      - iis_metabase_data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    depends_on:
      - mongodb

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: iis-drug-crm-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  pgadmin:
    image: dpage/pgadmin4:8.12
    container_name: iis-drug-crm-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'True'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - iis_pgadmin_data:/var/lib/pgadmin

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iis-drug-crm-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/iis_drug_crm
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/iis_drug_crm_analytics
      APP_FRONTEND_URL: http://localhost:4200
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-me-before-use-change-me-before-use}
      APP_JWT_EXPIRATION_MINUTES: 480
      BOOTSTRAP_ADMIN_USERNAME: admin
      BOOTSTRAP_ADMIN_EMAIL: dev_admin@local.dev
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-Admin123!}
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
      mongodb:
        condition: service_started
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend/iis-frontend
      dockerfile: Dockerfile
    container_name: iis-drug-crm-frontend
    depends_on:
      - backend
    ports:
      - "4200:4200"
    environment:
      # For reliable file change detection on some platforms (Windows)
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend/iis-frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  iis_postgres_data:
  iis_pgadmin_data:
  iis_mongo_data:
  iis_metabase_data:
  frontend_node_modules: